<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Vultix - Automated Web Vulnerability Scanner">
    <title>Login | Vultix</title>
    <!-- Theme initialization (prevent flash) -->
    <script>
        (function() {
            var theme = localStorage.getItem('vultix-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Auth CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

    <!-- Animated background particles -->
    <div class="auth-bg-particles">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
    </div>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-brand" id="authBrand">
            <div class="auth-brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1 class="auth-brand-text">Vultix</h1>
            <p class="auth-brand-sub">Web Vulnerability Scanner</p>
        </div>

        <!-- Login Card -->
        <div class="auth-card" id="loginCard">
            <div class="auth-card-header">
                <h2 class="auth-card-title">Welcome Back</h2>
                <p class="auth-card-subtitle">Sign in to your account to continue scanning</p>
            </div>

            {% if error %}
            <div class="auth-alert auth-alert-danger" id="authAlert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" novalidate>
                <!-- Username / Email Field -->
                <div class="auth-field" id="usernameField">
                    <label class="auth-label" for="loginUsername">
                        <i class="bi bi-person-fill"></i> Username or Email
                    </label>
                    <div class="auth-input-wrapper">
                        <i class="bi bi-person auth-input-icon"></i>
                        <input
                            type="text"
                            class="auth-input"
                            id="loginUsername"
                            name="username"
                            placeholder="Enter username or email"
                            value="{{ username|default('') }}"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <div class="auth-field-error" id="usernameError">Please enter your username or email</div>
                </div>

                <!-- Password Field -->
                <div class="auth-field" id="passwordField">
                    <label class="auth-label" for="loginPassword">
                        <i class="bi bi-lock-fill"></i> Password
                    </label>
                    <div class="auth-input-wrapper">
                        <i class="bi bi-lock auth-input-icon"></i>
                        <input
                            type="password"
                            class="auth-input"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="auth-toggle-pw" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="auth-field-error" id="passwordError">Please enter your password</div>
                </div>

                <!-- Remember Me -->
                <div class="auth-remember">
                    <label class="auth-checkbox-label" for="rememberMe">
                        <input type="checkbox" name="remember_me" id="rememberMe" class="auth-checkbox">
                        <span class="auth-checkbox-custom"></span>
                        <span>Remember me</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="auth-btn-text">Sign In</span>
                    <span class="auth-btn-loader" style="display:none;">
                        <span class="spinner-border spinner-border-sm"></span>
                        Signing in...
                    </span>
                    <i class="bi bi-arrow-right auth-btn-arrow"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>Don't have an account?</span>
            </div>

            <!-- Register Link -->
            <a href="{{ url_for('auth.register') }}" class="auth-link-btn">
                <i class="bi bi-person-plus-fill"></i> Create Account
            </a>
        </div>

        <!-- Theme Toggle -->
        <div class="auth-theme-toggle" id="authThemeToggle" title="Toggle theme" role="button">
            <i class="bi bi-moon-stars-fill theme-icon-dark"></i>
            <i class="bi bi-sun-fill theme-icon-light"></i>
        </div>
    </div>

    <!-- Auth JS -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
